# Flash procedures for this class. The upgrade (REPL push) is the tail
# that other esp8266-family classes compose via `use: <class-id>/<name>`.
schema: 1

procedures:
  upgrade:
    pre: "device already runs MicroPython (the COM12 case)"
    steps:
      - open-serial: { baud: 115200 }
      - sleep: 2.5s                        # ESP auto-reset on open
      - repl-interrupt: { ctrl_c: 2, settle: 300ms }
      - push-chunked:
          chunk: 512B                      # REPL buffer overflow ceiling
          read_timeout: 10s
          write_timeout: 5s
      - soft-reset: {}
      - sleep: 2.5s
      - verify-readback: { method: cat-file }   # read-back verify — cat the file, re-copy on mismatch
      - probe: { expect: suzu-d, timeout: 4s }

  # Factory-fresh onboarding: no interpreter answers the REPL, so the
  # Resident forces the ROM bootloader (the CH340's DTR/RTS circuit
  # enters it — no button), syncs at the working baud (the ROM
  # auto-bauds to the SYNC rate and latches), reads the flash chip's
  # JEDEC ID and sets the image header's flash size to match (the
  # ancestor's --flash_size=detect — skipping it boot-loops a 1 MiB
  # image on larger chips), erases, and writes the vendored runtime
  # image, then composes the shared push tail.
  #
  # Ancestor recipe, Python era (codified 2026-08-30, now native in
  # crates/suzu/src/bootloader.rs): `esptool erase_flash` +
  # `esptool write_flash --baud 460800 --flash_size=detect 0x0 <bin>`.
  # Codify verbatim; no improvements — omitting --flash_size=detect or
  # the 460800 baud once preceded a boot-loop state.
  install:
    pre: "no MicroPython — the ROM loader answers even from a crash loop"
    steps:
      - enter-download-mode: { via: native-rom-bootloader }
      - flash-runtime: { artifact: micropython-esp8266-1mib.bin, offset: 0x0, baud: auto }  # first SYNC baud latches; bench: 115200
      - poll-repl: { command: "print('mpready')", expect: mpready, timeout: 30s }
      - use: upgrade                    # compose the shared push tail

  # Files back to ship state: the native push re-runs (backup-first,
  # per-file read-back verify, soft reboot).
  soft:
    pre: "device runs MicroPython and answers the handshake"
    steps:
      - push-chunked: { via: native-raw-repl, fresh: false }
      - admission-test: {}

  # The true factory reset: back up the device files, erase every sector
  # through the ROM bootloader (the CH340's DTR/RTS circuit enters it —
  # no button), the MicroPython runtime is re-flashed from the vendored
  # artifact, and the faceplate is installed with the preserved
  # device_id. A factory-fresh board takes the same path; the backup
  # step simply finds no filesystem and records that fact.
  factory:
    pre: "device answers, or the ROM loader answers even from a crash loop"
    steps:
      - backup-files: { via: native-raw-repl }   # no-op on a silent board
      - enter-download-mode: { via: native-rom-bootloader }
      - flash-runtime: { artifact: micropython-esp8266-1mib.bin, offset: 0x0, baud: auto }  # first SYNC baud latches; bench: 115200
      - push-chunked: { via: native-raw-repl, fresh: true, with-identity: true }
      - admission-test: {}

  # Admission renders a known metrics pattern (G,report,88,77,66).
  # The device must acknowledge the command and the decoded capture
  # must contain at least 500 lit cyan pixels. The three-digit pattern
  # normally lights about 1040 pixels and the idle display about 40.
  # Label verification is skipped because this descriptor has no label.
  admission_test:
    display_check: metrics-pattern
    assert: "the metrics frame returns OK and has at least 500 lit pixels in the cyan area of the decoded capture"

artifacts:
  - file: micropython-esp8266-1mib.bin
    version: v1.29.0 (20260824)          # vendored + flash-verified 2026-08-30
    source: https://micropython.org/download/ESP8266_GENERIC/
    sha256: 94bfdf94a6c48ac5dfe79203577baad61a58c2525cc39a010b934a6666d4c551
    role: the MicroPython runtime
