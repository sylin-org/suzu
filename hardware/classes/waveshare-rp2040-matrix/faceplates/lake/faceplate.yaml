name: lake
class: waveshare-rp2040-matrix
display_name: The Lake
blurb: A color-only event and metric display for the 5x5 matrix
mount: usb-right                   # mounted on its long edge, connector to the right

# Ring protocol capabilities (ADR-0006). The 5x5 display cannot show
# qualifiers or text, so the Resident sends bare event verbs and does
# not wait for a DONE response.
rings:
  qualifiers: false
  text: false
