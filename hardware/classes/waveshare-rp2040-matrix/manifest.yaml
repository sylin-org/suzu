schema: 1
image: device.jpg               # product photo, Waveshare RP2040-Matrix (vendor listing via image search)
id: waveshare-rp2040-matrix
coverage_target: suzu-d            # + frames capability
flash:
  backend: circuitpy-drive-copy    # when CP is present (observed state)
  characteristics: "CP present → copy onto CIRCUITPY drive; blank board → BOOTSEL → RPI-RP2 → CP UF2 first"
  procedures:
    upgrade: circuitpy-drive-copy
    install: rp2040-bootsel
sets: []
display:
  type: rgb-matrix
  resolution: "5x5"
frame:
  size: 75                  # bytes on the wire: 25 px x 3 bytes rgb
  format: rgb24             # 3 bytes per pixel, (r, g, b)
  depth: 24
  order: row-major
  width: 5
  height: 5
  render: { rotate: 0 }
constraints: "25 px; host-side frames engine"
boards:
  - name: "Waveshare RP2040-Matrix, Type-C"
    status: observed               # COM15 2026-08-28, CircuitPython, silent to I
