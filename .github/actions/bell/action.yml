name: "Ring the suzu bell"
description: >-
  Notify a suzu Resident — a small fleet of companion displays — that a
  job finished. Point it at a self-hosted runner's LAN or a tunneled
  endpoint.
inputs:
  host:
    description: "The Resident's base URL (e.g. http://192.168.1.109:7899)"
    required: true
  signal:
    description: "transition · discovery · completion · alert"
    required: false
    default: "completion"
  label:
    description: "The words the face shows"
    required: false
    default: ""
  token:
    description: "The SUZU_API_TOKEN the Resident expects (empty = open loopback)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        curl -sf -X POST "${{ inputs.host }}/api/say" \
          ${{ inputs.token != '' && format('-H "authorization: Bearer {0}"', inputs.token) || '' }} \
          -H "content-type: application/json" \
          -d '{"signal":"${{ inputs.signal }}","label":"${{ inputs.label }}"}' \
          && echo "::notice::the bell has rung"
