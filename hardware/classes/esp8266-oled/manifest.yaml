# The class manifest: what servicing targets. Boards are incarnations;
# identity (device_id) belongs to individuals and lives in evidence/.
schema: 1
image: device.jpg               # product photo, ESP8266 NodeMCU-class board with 0.96 OLED (via image search)
id: esp8266-oled
coverage_target: suzu-d
flash:
  backend: repl-push
  baud: 115200
  characteristics: "80 KB RAM — chunked raw-REPL writes (512 B); mpremote cp flaky"
display:
  type: oled-dual-zone
  resolution: "128x64"
  zones:
    - { rows: [0, 15], color: "#ffdd00" }    # yellow strip (native top)
    - { rows: [16, 63], color: "#00d5ff" }   # cyan field
frame:
  size: 1024                # bytes on the wire (base64-wrapped in the J ack)
  format: mvlsb             # column bytes, 8 vertical px each, D0 = top of the byte
  depth: 1                  # bits per pixel as shipped
  order: column-major
  width: 128
  height: 64
  render: { rotate: 90 }             # the panel stands on its long edge; viewing size is the client's
  palette: ["#000000", "#ffffff"]    # fallback when no display zone covers a row
sets: [os]
boards:
  - name: "EstarDyn NodeMCU ESP8266 V3, Type-C"
    status: suspected                # vendor listing 2026-08-28
  - name: "TZT NodeMCU ESP8266 V3, Type-C (yellow)"
    status: suspected                # vendor listing 2026-08-28
  - name: "NodeMCU ESP8266 + OLED class — multiple units (CH340)"
    status: observed                 # 2026-08-28: three individuals across sessions
class_notes: |
  CH340 bridges report a constant serial ("6"): USB-level identity is
  identical on every unit, so individuals are distinguishable only after
  the probe (device_id / hardware_id). Ports must never be trusted
  across replugs for this class — always re-probe.
  Device_id mint order across the first three units spans ~6 hours —
  provisioning chronology is recoverable from GUIDv7 timestamps.
  INCIDENT (2026-08-28, the first hardware incident of the project):
  this unit was plugged in PERFECTLY WORKING — firefly v2.0.0,
  answering the handshake. The suzu author's migration script bricked
  it (interrupted pushes -> boot loop, garbage on serial, no
  handshake), and then the author misdiagnosed the damage as "suspect
  hardware / failed flash chip" and committed that blame to this very
  file. The unit was recovered by running the legacy
  installer (NewFirefly.ps1), which erased, flashed, provisioned
  (device_id 01a04aea-aa63-7be3-995e-96fe5522eeb), tested the display,
  and started the firmware — everything the author failed to do.
  Rule zero of any installer, learned here: never modify a working
  device unless the procedure is proven to complete AND to roll back;
  and when your own procedure fails, the first suspect is your
  procedure — never the silicon.
  CORRECTION (2026-08-28, later): the "boot-loop garbage" unit was NOT
  suspect hardware. Our cancelled flash-write left it half-written;
  the unit runs the old PoC firmware (firefly v2.0.0) and was
  re-provisioned by the user via the legacy installer. Suzu made no
  changes to any device. Lesson recorded in install-lessons.md: a tool
  reports what happened; it never concludes what the hardware is, and
  it never claims credit for a recovery it did not perform.
migration:
  to: suzu-d
  keep: [device_id, hardware_id]     # identity survives the upgrade
  descriptor_map: { family: companion, version: firmware }
