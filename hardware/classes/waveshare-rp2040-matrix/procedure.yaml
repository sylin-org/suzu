# Flash + maintenance procedures for this class. The step names here
# define the steps followed by maintenance procedures; the executor
# lives in crates/suzu/src/resident/maintenance.rs (ADR-0003).
schema: 1

procedures:
  install:
    pre: "planned — BOOT during reset enters UF0 download mode"
    steps:
      - say: "Hold BOOT while plugging in."
      - wait-mount: { label: RPI-RP2, timeout: 30s }
      - copy: { file: suzu-d-rp2040-matrix.uf2 }
      - wait-unmount: { label: RPI-RP2, timeout: 15s }
      - sleep: 2s
      - probe: { expect: suzu-d, timeout: 4s }

  # Files back to ship state; the CircuitPython runtime is untouched.
  soft:
    pre: "device is adopted and the CIRCUITPY drive is mounted"
    steps:
      - backup-identity: { keep: [device_id, hardware_id] }
      - write: { file: code.py, from: firmware }
      - write: { file: suzu.json, identity-restored: true }
      - verify-readback: { files: [code.py, suzu.json] }
      - force-reload: { ctrl_c: 2, ctrl_d: true }   # autoreload is disabled on the device
      - admission-test: {}

  # The nuke: every flash cell falls to 0xFF, then the runtime and the
  # face are rebuilt. Identity is backed up first and restored after —
  # a factory reset never orphans an individual.
  factory:
    pre: "CIRCUITPY mounted (identity backup), a human at the box for the BOOTSEL gate"
    steps:
      - backup-identity: { keep: [device_id, hardware_id] }
      - human-gate: "hold BOOTSEL and replug"
      - wait-mount: { label: RPI-RP2, timeout: 300s }
      - copy: { artifact: flash_nuke.uf2 }
      - wait-mount: { label: RPI-RP2, timeout: 60s }   # the erase image reboots into the bootloader
      - copy: { artifact: circuitpython-raspberry_pi_pico.uf2 }
      - wait-mount: { label: CIRCUITPY, timeout: 60s }
      - write: { file: code.py, from: firmware }
      - write: { file: suzu.json, identity-restored: true }
      - verify-readback: { files: [code.py, suzu.json] }
      - admission-test: {}

  # Admission checks required before streaming (ADR-0003).
  # Steps: handshake (I returns a descriptor), keepalive-ack (K returns OK),
  # label-roundtrip (when the descriptor declares a label), and
  # display-check: a completion-blue pattern is drawn and captured via the
  # J capture. The color threshold distinguishes it from other states.
  admission_test:
    display_check: completion-pattern
    assert: "any pixel with r<60 && g>50 && b>80 in the decoded view"

# Vendored so factory reset works offline. Checksums are verified before erase.
artifacts:
  - file: flash_nuke.uf2
    sha256: f1d80fcc37161df8cbdf16a58c111208f06234976a470c17699270d212e91754
    source: https://datasheets.raspberrypi.com/soft/flash_nuke.uf2
    role: total-flash-erase (BOOTSEL bootloader survives)
  - file: circuitpython-raspberry_pi_pico.uf2
    version: 10.0.3 (en_US)             # the build the fleet runs (boot_out.txt)
    source: https://downloads.circuitpython.org/bin/raspberry_pi_pico/en_US/
    sha256: ff32bcf0be8f2707698e5d37ae903f1c016fbf826214cf9bb6e61cc5594506c7
    role: the CircuitPython runtime
