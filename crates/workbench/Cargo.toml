[package]
name = "suzu-workbench"
description = "Desktop management interface for the Suzu Resident and connected devices"
homepage = "https://sylin.org/suzu"
repository = "https://github.com/sylin-org/suzu"
authors = ["Leo Botinelly <leonardo.botinelly@gmail.com>"]
publish = false
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
serde_json = "1"
tauri = { version = "=2.11.5", features = ["image-png", "tray-icon"] }

[build-dependencies]
tauri-build = "=2.6.3"
