name: slate
class: esp8266-oled
display_name: Slate
blurb: A console readout — block digits, honest gauges, an embossed name
version: "1.1.0"                   # the currency gate reads it (ADR-0005, amended)
status: beta                       # poured 2026-08-31 — verified on the bench

# Ground "report" slots, in the order the face reads them.
# (255 / missing -> drawn as a dash: "not measured", not zero.)
slots: [cpu, mem, gpu]

# Fast-lane atoms: on Slate the pulse is a heartbeat — the dot at the
# label strip's end fills while traffic is fresh. No value is carried.
extras: [audio.level]

# suzu/1 frames this face answers (see the parent's README).
frames: [I, K, G, A, J, S, X, R]

# The ring voice (ADR-0006): what this face can speak. The instance
# degrades every say to this dialect before a byte reaches the wire.
rings:
  qualifiers: true
  text: true

# The hangs this face declares. Each variant is a bundle directory
# beside this manifest, named for its mount; the id is what a dressed
# face reports and what the currency gate reads; the blurb guides the
# chooser. The build derives every non-parent hang from the parent's
# source (tools/build_faceplates.py) — regenerate, never hand-edit.
variants:
  - mount: usb-down
    id: slate
    blurb: hangs upwards — the connector sits at the bottom
  - mount: usb-up
    id: slate-up
    blurb: hangs downwards — the connector sits at the top
  - mount: usb-left
    id: slate-left
    blurb: landscape — the connector at the left; the words turn to read upright
  - mount: usb-right
    id: slate-right
    blurb: landscape — the connector at the right; the words turn to read upright

# The tool installs what the faceplate declares — files are pushed
# verbatim, never interpreted. Art lives in the files, not in the tool.
resources:
  install:
    - { from: main.py, to: main.py }      # bootstrap: imports face
    - { from: face.mpy, to: face.mpy }    # the face, as bytecode
    - { from: digits_slate.bin, to: digits_slate.bin }
    - { from: icons.bin, to: icons.bin }  # moment icons (8x8 sprites)

# Font provenance (regenerate, never hand-edit the bin). A tall
# terminal face, delightfully CRT; rendered by the shared pipeline
# into the raw device bin.
font:
  family: VT323
  license: SIL-OFL-1.1
  source: tools/fonts/VT323-Regular.ttf
  generator: tools/font2sprites.py
  data: down-mount/digits_slate.bin
  cap-height: 26
