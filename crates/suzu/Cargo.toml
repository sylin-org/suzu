[package]
name = "suzu"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "suzu — detect, identify, and service a fleet of small companion displays; the Resident service and its CLI"
homepage = "https://sylin.org/suzu"
repository = "https://github.com/sylin-org/suzu"
authors = ["Leo Botinelly <leonardo.botinelly@gmail.com>"]
keywords = ["hardware", "serial", "embedded", "service", "monitoring"]
categories = ["hardware-support", "command-line-utilities"]
readme = "../../README.md"

[dependencies]
anyhow = "1"
chrono = { workspace = true }
tokio = { workspace = true }
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
serialport = "4"
gif = "0.13"
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Performance"] }
