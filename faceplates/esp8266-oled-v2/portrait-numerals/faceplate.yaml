name: portrait-numerals
status: beta                      # live on the bench since 2026-08-28
class: esp8266-oled-v2-class
display_name: BIG!
blurb: Easy to read from a distance
mount: usb-down                   # hangs upwards — the connector sits at the bottom
version: "2.0.0"                   # the stage grammar — currency-gates the stream (ADR-0005)

# Ground "report" slots, in the order the face reads them.
# (255 / missing -> drawn as a dash: "not measured", not zero.)
slots: [cpu, mem, gpu]

# Fast-lane atoms the face consumes; the pulse dividers.
extras: [audio.level]

# suzu/1 frames this face answers (see README).
frames: [I, K, G, A, J, S, X, R]

# The ring voice (ADR-0006): what this face can speak. The instance
# degrades every say to this dialect before a byte reaches the wire.
# The ring voice (ADR-0006): what this face can speak. The instance
# degrades every say to this dialect before a byte reaches the wire.
rings:
  qualifiers: true      # dotted signals arrive whole (WARN.disk)
  text: true            # a words channel exists (the band)

# The tool installs what the faceplate declares — files are pushed
# verbatim, never interpreted. Art lives in the files, not in the tool.
resources:
  install:
    - { from: main.py, to: main.py }      # bootstrap: imports face
    - { from: face.mpy, to: face.mpy }    # the face, as bytecode
    - { from: digits_bebas.bin, to: digits_bebas.bin }
    - { from: icons.bin, to: icons.bin }        # moment icons (8x8 sprites)

# Provenance of the digit art (regenerate, never hand-edit). The raw
# bin is what the device reads (one glyph at a time — import RAM on
# the ESP8266 is 80 KB and spoken for); the .py module is host-side
# reference only.
font:
  family: Bebas Neue
  license: SIL-OFL-1.1
  source: tools/fonts/BebasNeue-Regular.ttf
  icons:
    source: firmware/suzu-d/esp8266-oled-v2/icons.py (stage set, redrawn
      after Bootstrap Icons' cpu/gpu-card — MIT — and Lucide's
      memory-stick — ISC)
    packer: tools/pack_icons.py
    keys: cpu gpu mem   # one sprite per ground area, in the areas' order
  bytecode: "face.mpy — python -m mpy_cross -march=xtensa face.py -o face.mpy"
  # (this firmware auto-runs main.py only; face.py is the human source)
  generator: tools/font2sprites.py
  data: digits_bebas.bin
  cap-height: 24
